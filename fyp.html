<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeX Warriors</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(#1e3c72, #2a5298);
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 50px;
            height: 70px;
            background: #00ff88;
            position: absolute;
            bottom: 50px;
            left: 100px;
            border-radius: 10px;
        }

        .enemy {
            width: 50px;
            height: 60px;
            background: red;
            position: absolute;
            bottom: 50px;
            border-radius: 10px;
        }

        #ground {
            width: 100%;
            height: 50px;
            background: #333;
            position: absolute;
            bottom: 0;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 30px;
        }

        #health {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff88;
            font-size: 25px;
        }

        button {
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="score">Score: 0</div>

    <div id="health">❤️ ❤️ ❤️</div>

    <div id="player"></div>

    <div id="ground"></div>

</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreText = document.getElementById("score");

let playerX = 100;
let isJumping = false;
let score = 0;

/* PLAYER MOVEMENT */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        playerX += 20;
    }

    if (event.key === "ArrowLeft") {
        playerX -= 20;
    }

    if (event.key === " ") {
        jump();
    }

    player.style.left = playerX + "px";

});


/* JUMP FUNCTION */

function jump() {

    if (isJumping) return;

    isJumping = true;

    let position = 50;

    let up = setInterval(() => {

        position += 10;

        player.style.bottom = position + "px";

        if (position >= 250) {

            clearInterval(up);

            let down = setInterval(() => {

                position -= 10;

                player.style.bottom = position + "px";

                if (position <= 50) {

                    clearInterval(down);

                    isJumping = false;
                }

            }, 20);

        }

    }, 20);

}


/* CREATE ENEMIES */

function createEnemy() {

    const enemy = document.createElement("div");

    enemy.classList.add("enemy");

    enemy.style.left = window.innerWidth + "px";

    game.appendChild(enemy);

    let enemyX = window.innerWidth;

    const moveEnemy = setInterval(() => {

        enemyX -= 5;

        enemy.style.left = enemyX + "px";

        if (enemyX < -50) {

            clearInterval(moveEnemy);

            enemy.remove();

        }

    }, 20);

}


setInterval(createEnemy, 2000);


/* ATTACK */

document.addEventListener("keydown", function(event) {

    if (event.key === "x" || event.key === "X") {

        const enemies = document.querySelectorAll(".enemy");

        enemies.forEach(enemy => {

            const enemyRect = enemy.getBoundingClientRect();
            const playerRect = player.getBoundingClientRect();

            if (
                enemyRect.left < playerRect.right + 100 &&
                enemyRect.right > playerRect.left
            ) {

                enemy.remove();

                score += 10;

                scoreText.innerHTML = "Score: " + score;

            }

        });

    }

});

</script>

</body>
</html>
