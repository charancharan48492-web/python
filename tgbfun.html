<!DOCTYPE html>

<html>

<head>

  <title>FUNNY BRO</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      font-family: Arial, sans-serif;

    }

    body {

      background: #fafafa;

    }

    header {

      background: white;

      border-bottom: 1px solid #ddd;

      padding: 15px;

      text-align: center;

      font-size: 28px;

      font-weight: bold;

    }

    .stories {

      display: flex;

      gap: 15px;

      padding: 15px;

      background: white;

      overflow-x: auto;

    }

    .story {

      text-align: center;

      font-size: 12px;

    }

    .story img {

      width: 65px;

      height: 65px;

      border-radius: 50%;

      border: 3px solid #e1306c;

      padding: 2px;

    }

    .post {

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border: 1px solid #ddd;

    }

    .username {

      padding: 12px;

      font-weight: bold;

    }

    .post img {

      width: 100%;

      display: block;

    }

    .actions {

      padding: 10px;

      font-size: 25px;

    }

    .actions button {

      border: none;

      background: none;

      font-size: 24px;

      cursor: pointer;

      margin-right: 10px;

    }

    .likes {

      padding: 0 10px;

      font-weight: bold;

    }

    .caption {

      padding: 10px;

    }

    .comment-box {

      display: flex;

      border-top: 1px solid #eee;

    }

    .comment-box input {

      flex: 1;

      padding: 12px;

      border: none;

      outline: none;

    }

    .comment-box button {

      padding: 10px;

      border: none;

      background: #0095f6;

      color: white;

      cursor: pointer;

    }

    #comments {

      padding: 10px;

    }

  </style>

</head>

<body>

  <header>FUNNY BRO</header>

  <!-- Stories -->

  <div class="stories">

    <div class="story">

      <img src="https://i.pravatar.cc/100?img=1">

      <p>You</p>

    </div>

    <div class="story">

      <img src="https://i.pravatar.cc/100?img=2">

      <p>Alex</p>

    </div>

    <div class="story">

      <img src="https://i.pravatar.cc/100?img=3">

      <p>Sam</p>

    </div>

    <div class="story">

      <img src="https://i.pravatar.cc/100?img=4">

      <p>charan</p>

    </div>

  </div>

  <!-- Post -->

  <div class="post">

    <div class="username">

      📷 praveen

    </div>

    <img src="https://picsum.photos/600/600" alt="Post">

    <div class="actions">

      <button onclick="likePost()">❤️</button>

      <button>💬</button>

      <button>📤</button>

    </div>

    <div class="likes">

      <span id="likeCount">120</span> likes

    </div>

    <div class="caption">

      <b>praveen</b> Enjoying the day! 📸🔥

    </div>

    <div id="comments"></div>

    <div class="comment-box">

      <input id="commentInput" placeholder="Add a comment...">

      <button onclick="addComment()">Post</button>

    </div>

  </div>

  <script>

    let likes = 120;

    function likePost() {

      likes++;

      document.getElementById("likeCount").innerText = likes;

    }

    function addComment() {

      let input = document.getElementById("commentInput");

      let comment = input.value;

      if (comment.trim() !== "") {

        let newComment = document.createElement("p");

        newComment.innerHTML =

          "<b>rudhu</b> " + comment;

        document.getElementById("comments")

          .appendChild(newComment);

        input.value = "";

      }

    }

  </script>

</body>

</html>
